<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bewegungen im Spiel prüfen</title>
<style>body{margin:0;background:#172e35;color:#fff0cb;font:14px system-ui}main{max-width:1100px;margin:auto;padding:8px}h1{font-size:17px;margin:0 0 4px}button,select{padding:5px 10px;margin:2px;font:inherit}iframe{width:100%;height:650px;border:0}#status{white-space:pre-wrap;max-height:130px;overflow:auto}#tools{display:flex;flex-wrap:wrap;align-items:center}</style>
<main><h1>Bewegungsprobe – eigener Spielstand im Arbeitsspeicher</h1>
<div id="tools">
<button data-scene="DesertRuinScene">Wüste</button><button data-scene="DesertEndlessScene">Oase</button><button data-scene="DesertTunnelScene">Steinbruch</button>
<button data-scene="UndergroundDigScene">Unterwelt</button><button data-scene="JungleScene">Urwald</button><button data-scene="CoinChallengeScene">Funkelkammer</button>
<button id="gender">Ritterin / Ritter</button><button id="weapon">Schwert / Hammer</button><button id="shoes">Schuhe an / aus</button>
<button data-action="walk">Gehen</button><button data-action="run">Rennen</button><button data-action="jump">Sprung</button><button data-action="crouch">Ducken</button>
<button data-action="swing">Schlag</button><button data-action="bow">Bogen</button><button data-action="hurt">Helfer schützt</button><button data-action="berry">Beere</button><button data-action="crumble">Block</button>
<button id="gallery">Schläge in Einzelbildern</button><button id="motion-gallery">Bewegungen in Einzelbildern</button><button id="test">Abläufe prüfen</button>
<button id="proportions">Proportionen vergleichen</button><button id="music-test">Musik beim Verlassen prüfen</button>
<button id="sword-gallery">Schwert B: drei Höhen</button><button id="sword-test">Schwerthöhen prüfen</button>
<button id="hands-gallery">Rechte Hand vergleichen</button>
<button id="hammer-gallery">Hammer: drei Höhen</button><button id="hammer-test">Hammerabläufe prüfen</button>
<button id="arm-compare">Arme: Stand und Schlag</button>
<button id="capture-comparison">Vergleichsbild</button><button id="joint-overlay" aria-pressed="false">Gelenke anzeigen</button>
<button data-action="trainer">Meister Muck prüfen</button><button data-action="trainer-super">Training: volle Ladung</button><button data-action="trainer-jump">Training: Sprung</button><button id="training-test">Drei Übungen prüfen</button>
<button id="inventory-open">Inventar ansehen</button><button id="inventory-info">Inventarzustand</button><button id="controls-test">Tasten &amp; Inventar prüfen</button>
<span id="sword-tools" hidden><button id="sword-play">Abspielen</button><label>Schlag <input id="sword-frame" type="range" min="0" max="139" value="65"></label><button id="sword-direction">Blickrichtung wechseln</button><label id="arm-weapon-label" hidden>Waffe <select id="arm-weapon"><option value="powerHammer">Hammer</option><option value="sword">Schwert</option></select></label><label id="hammer-kind-label" hidden>Hammer <select id="hammer-kind"><option value="normal">Normal</option><option value="quick">Gelb</option><option value="power">Rot</option><option value="super">Blau</option><option value="charge">Aufladen</option><option value="slam">Sprungschlag</option><option value="recovery">Zurücknehmen</option></select></label><label>Bewegung <select id="hand-state"><option value="idle">Ruhe</option><option value="walk">Gehen</option><option value="run">Rennen</option><option value="crouch">Geduckt</option><option value="jump">Sprung</option></select></label></span>
</div><div id="status" role="status">Lädt …</div><iframe title="Spiel zur Bewegungsprüfung" id="game"></iframe></main>
<script type="module" src="level-animation-review.js?v=sword-range-1"></script></html>
