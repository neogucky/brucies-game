<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruce – Intro- und Hebeltests</title>
<style>
body{margin:0;background:#ded5bb;color:#192e31;font:15px system-ui}main{max-width:1100px;margin:auto;padding:12px}
button{font:inherit;padding:7px 12px;margin:3px;cursor:pointer}button:disabled{opacity:.5}
#results{white-space:pre-wrap;max-height:180px;overflow:auto}iframe{display:block;border:0;width:100%;height:670px}
#lever-tools{display:none}#metrics{font:13px monospace}h1{font-size:19px;margin:0 0 8px}
</style>
<main>
<section id="tools">
<h1>Integrationsprüfungen mit künstlichen Eingaben</h1>
<p>Eigener Spielstand im Arbeitsspeicher. Dein gespeichertes Spiel wird nicht verändert.</p>
<button id="run">Intro-Tests starten</button>
<button id="preview">Hebel prüfen</button>
<pre id="results" role="status">Bereit</pre>
<div id="lever-tools">
<button data-world="desert">Wüste</button><button data-world="underground">Unterwelt</button><button data-world="jungle">Urwald</button>
<button data-gender="male">Ritter</button><button data-gender="female">Ritterin</button>
<button data-frame="600">Greifen</button><button data-frame="1100">Mitte</button><button data-frame="1550">Ende</button>
<button id="hide">Prüfleiste ausblenden</button>
<p id="metrics"></p>
</div>
</section>
<iframe title="Isolierter Spieltest" id="game-frame"></iframe>
</main>
<script type="module" src="browser-regressions.js"></script>
</html>
